<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン</title>
  <script src="config.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input[type="password"] {
      width: 80%;
      padding: 0.5rem;
      margin: 1rem 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1.5rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error-msg {
      color: red;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>パスワードを入力</h2>
    <form onsubmit="checkPassword(event)">
      <input type="password" id="password-input" placeholder="パスワード">
      <br>
      <button type="submit">ログイン</button>
    </form>
    <div id="error-message" class="error-msg">パスワードが違います</div>
  </div>

  <script>
    function checkPassword(event) {
      event.preventDefault();
      const input = document.getElementById("password-input").value;
      const errorMsg = document.getElementById("error-message");

      const currentPwd = localStorage.getItem("site_login_password") || SITE_CONFIG.loginPassword;

      if (input === currentPwd) {
        sessionStorage.setItem("isLoggedIn", "true");
        window.location.href = "main.html";
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
